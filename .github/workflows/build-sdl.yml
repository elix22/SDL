          path: out/sdl3-windows-x64-Release.tar.gz
          retention-days: 90

      - name: Publish to release (permanent)
        if: steps.published.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prebuilt-${{ steps.pin.outputs.short }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SDL3 prebuilt ($TAG)" \
              --notes "Prebuilt SDL3 libraries at pinned commit ${{ steps.pin.outputs.sha }}. Release config only. Produced by build-sdl.yml."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "sdl3-windows-x64-Release.tar.gz"; then
            echo "already published — keeping the pinned bytes"
          else
            gh release upload "$TAG" out/sdl3-windows-x64-Release.tar.gz --repo "$GITHUB_REPOSITORY"
          fi

  build-linux:
    name: Build Linux (x64 static)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (main)
        uses: actions/checkout@v4

      - name: Read pinned SDL commit
        id: pin
        shell: bash
        run: |
          SHA=$(tr -d '[:space:]' < scripts/PINNED_COMMIT)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:9}" >> "$GITHUB_OUTPUT"

      # Debug-loop economy: a pushed script tweak must not rebuild artifacts that are
      # already published and immutable — probe the release first and no-op the job.
      - name: Skip if this artifact is already published (immutable)
        id: published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prebuilt-${{ steps.pin.outputs.short }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "sdl3-linux-x64-Release.tar.gz"; then
            echo "sdl3-linux-x64-Release.tar.gz already published for $TAG — skipping the build"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout pinned SDL source
        if: steps.published.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pin.outputs.sha }}
          path: sdl-src

      # The consuming runtime's desktop needs X11 (hard) + the usual driver set;
      # SDL silently drops any driver whose -dev headers are absent, so install
      # them all here (mirrors the runtime's ci.yml list + audio).
      - name: System deps (video/audio -dev packages)
        if: steps.published.outputs.skip != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libegl-dev libgles-dev libgl1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev

      - name: Build
        if: steps.published.outputs.skip != 'true'
        shell: bash
        run: bash scripts/build-linux.sh sdl-src out

      - name: Upload build artifact (90-day convenience copy)
        if: steps.published.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdl3-linux-x64-Release
          path: out/sdl3-linux-x64-Release.tar.gz
          retention-days: 90

      - name: Publish to release (permanent)
        if: steps.published.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="prebuilt-${{ steps.pin.outputs.short }}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "SDL3 prebuilt ($TAG)" \
              --notes "Prebuilt SDL3 libraries at pinned commit ${{ steps.pin.outputs.sha }}. Release config only. Produced by build-sdl.yml."
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx "sdl3-linux-x64-Release.tar.gz"; then
            echo "already published — keeping the pinned bytes"
          else
            gh release upload "$TAG" out/sdl3-linux-x64-Release.tar.gz --repo "$GITHUB_REPOSITORY"
          fi
